name: my_note_app
description: "云端计划 - 个人知识管理工具"
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: ^3.12.2
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  just_audio: ^0.9.40
  just_audio_windows: ^0.2.3
  http: ^1.2.0
  flutter_quill: ^11.5.1
  # 本地存储
    # Drift（换库：sqflite/prefs → Drift）
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  path: ^1.9.0
  shared_preferences: ^2.2.0
  # 文件选择
  file_picker: 12.2.0
  # 路径和文件操作
  path_provider: ^2.1.0
  # Markdown 支持
  flutter_markdown: ^0.7.0
  markdown: ^7.3.1
  url_launcher: ^6.3.2
  # 瀑布流网格
  flutter_staggered_grid_view: ^0.7.0

  image_picker: ^1.1.0

  # 社交分享
  share_plus: 13.3.0

  # PDF 编辑器（纯 Dart，跨平台，支持标准批注/高亮）
  dart_pdf_editor: ^2.0.0

  # EPUB 解析
  epubx: ^3.0.0

  # SVG 支持
  flutter_svg: ^2.0.0

  # Supabase 云存储
  supabase_flutter: ^2.8.0

  # 环境变量
  flutter_dotenv: ^5.1.0

  # HTML 渲染（EPUB）
  flutter_widget_from_html: ^0.15.0

  cupertino_icons: ^1.0.8
  package_info_plus: 10.2.1
  wakelock_plus: 1.8.0
  mobile_scanner: ^7.4.0
  pdfrx: ^2.6.1
  printing: 5.14.3
  pdf: 3.10.3

  # ✅ 第五轮新增：EPUB 导出
  archive: ^3.3.0
  xml: 6.3.0
  flutter_secure_storage: ^10.3.4
  sqlite3_flutter_libs: ^0.6.0+eol
  webview_ultra: ^0.0.6+8

  # ✅ Step 3A：TTS 与翻译
  flutter_tts: ^4.2.5
  translator: ^1.0.4+1

  # ✅ PDF Spike 验证所需
dev_dependencies:
  flutter_test:
    sdk: flutter    
  mocktail: ^1.0.0
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: 2.35.1
  build_runner: 2.16.2

dependency_overrides:
  archive: ^3.3.0
  image: ^4.0.0
  xml: 6.3.0
  webview_flutter: ^4.0.0
  # build_runner 2.16.1 依赖 build 4.1.0（有 librarySourceSink Bug）
  build: 4.0.11  
  analyzer: 14.5.0        # ← 加这行
  win32: ^6.0.1
flutter:
  uses-material-design: true
  assets:
    - assets/images/pet/
    - assets/audio/          # ✅ 小云形象替换轮：PNG 图目录（pet_happy / pet_sad / pet_blink）
    - assets/fonts/          # ✅ 小云形象替换轮：PNG 图目录（pet_happy / pet_sad / pet_blink）
  
