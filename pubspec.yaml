name: my_note_app
description: "云脑计划 - 个人知识管理工具"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # 本地存储
  sqflite: ^2.3.0
  path: ^1.9.0
  shared_preferences: ^2.2.0
  sqflite_common_ffi: ^2.3.0

  # 文件选择
  file_picker: ^8.0.0

  # 网络请求
  http: ^1.1.0

  # 路径和文件操作
  path_provider: ^2.1.0

  # Markdown 支持
  flutter_markdown: ^0.7.0

  # 瀑布流网格
  flutter_staggered_grid_view: ^0.7.0

  # 社交分享
  share_plus: ^7.0.0

  # ✅ PDF 预览（核心依赖 — PDF阅读器必需）
  printing: ^5.11.0

  # ✅ 异步状态管理（可选，用于 FutureBuilder 优化）
  # flutter_bloc: ^8.1.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.0
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true