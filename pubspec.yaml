name: my_note_app
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # 本地存储
  sqflite: ^2.3.0
  path: ^1.9.0
  shared_preferences: ^2.2.0
  sqflite_common_ffi: ^2.3.0

  # 文件选择
  file_picker: ^8.0.0

  # 网络请求
  http: ^1.1.0

  # PDF 阅读
  pdf: ^3.10.0

  # Markdown 支持
  flutter_markdown: ^0.7.0

  # 瀑布流网格
  flutter_staggered_grid_view: ^0.7.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true